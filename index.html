<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Ventas Diarias – Mundo Sport</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #D32F2F;
    --red-dark: #9B1C1C;
    --red-glow: rgba(211,47,47,0.3);
    --black: #0A0A0A;
    --surface: #141414;
    --card: #1C1C1C;
    --border: #2A2A2A;
    --white: #FFFFFF;
    --gray: #888;
    --light-gray: #CCCCCC;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(211,47,47,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 80% 80%, rgba(211,47,47,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Grid texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .wrapper {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.7s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(211,47,47,0.15),
      0 30px 80px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* Header stripe */
  .header-stripe {
    height: 5px;
    background: linear-gradient(90deg, var(--red-dark), var(--red), var(--red-dark));
  }

  /* Logo area */
  .logo-area {
    background: var(--black);
    padding: 36px 40px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .logo-area::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 2px;
    background: var(--red);
  }

  .logo-img {
    height: 80px;
    object-fit: contain;
    filter: drop-shadow(0 4px 20px rgba(211,47,47,0.4));
  }

  .location-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--red);
    margin-top: 4px;
    font-weight: 500;
  }

  /* Form header */
  .form-header {
    padding: 28px 40px 0;
    text-align: center;
  }

  .form-title {
    font-family: 'Oswald', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1.3;
  }

  .form-title span {
    color: var(--red);
  }

  .form-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 40px 0;
  }

  .form-divider::before,
  .form-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-divider-icon {
    color: var(--red);
    font-size: 16px;
  }

  /* Form body */
  form {
    padding: 28px 40px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gray);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  label .required {
    color: var(--red);
    font-size: 14px;
    line-height: 1;
  }

  input[type="date"],
  input[type="text"],
  input[type="number"],
  textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--white);
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    -webkit-appearance: none;
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) brightness(0.6);
    cursor: pointer;
  }

  input:focus,
  textarea:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow);
    background: #1a1a1a;
  }

  input.error-field,
  textarea.error-field {
    border-color: #ff5252;
    box-shadow: 0 0 0 3px rgba(255,82,82,0.2);
  }

  textarea {
    resize: vertical;
    min-height: 100px;
    line-height: 1.6;
  }

  /* Amount field */
  .amount-wrap {
    position: relative;
  }

  .amount-wrap input {
    padding-left: 42px;
  }

  .currency-symbol {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--red);
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 600;
    pointer-events: none;
  }

  /* Payment method */
  .payment-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .payment-option {
    position: relative;
  }

  .payment-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .payment-option label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--gray);
    font-weight: 500;
    text-transform: uppercase;
  }

  .payment-option label .icon {
    font-size: 20px;
  }

  .payment-option input[type="radio"]:checked + label {
    border-color: var(--red);
    background: rgba(211,47,47,0.12);
    color: var(--white);
    box-shadow: 0 0 0 3px var(--red-glow);
  }

  .payment-option label:hover {
    border-color: rgba(211,47,47,0.5);
    color: var(--light-gray);
  }

  .payment-options.error-field-radio .payment-option label {
    border-color: #ff5252;
    box-shadow: 0 0 0 2px rgba(255,82,82,0.15);
  }

  /* Submit button */
  .btn-submit {
    background: linear-gradient(135deg, var(--red-dark), var(--red));
    color: var(--white);
    border: none;
    border-radius: 3px;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    margin-top: 6px;
    box-shadow: 0 4px 20px rgba(211,47,47,0.3);
  }

  .btn-submit::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(211,47,47,0.5);
  }

  .btn-submit:hover::before { opacity: 1; }

  .btn-submit:active {
    transform: translateY(0);
  }

  /* Footer stripe */
  .footer-stripe {
    height: 3px;
    background: linear-gradient(90deg, var(--red-dark), var(--red), var(--red-dark));
  }

  /* NOTIFICATIONS */
  .toast-container {
    position: fixed;
    top: 28px;
    right: 28px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }

  .toast {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    background: var(--card);
    border-radius: 4px;
    padding: 18px 20px;
    min-width: 320px;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    pointer-events: all;
    border-left: 4px solid;
    animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(60px) scale(0.9); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }

  .toast.hide {
    animation: toastOut 0.3s ease forwards;
  }

  @keyframes toastOut {
    to { opacity: 0; transform: translateX(60px) scale(0.9); }
  }

  .toast.success { border-color: #4CAF50; }
  .toast.error   { border-color: #ff5252; }

  .toast-icon {
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .toast.success .toast-icon { color: #4CAF50; }
  .toast.error   .toast-icon { color: #ff5252; }

  .toast-content {}

  .toast-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 4px;
  }

  .toast-msg {
    font-size: 13px;
    color: var(--light-gray);
    line-height: 1.5;
  }

  .toast-close {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--gray);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 0 0 8px;
    flex-shrink: 0;
    transition: color 0.2s;
  }

  .toast-close:hover { color: var(--white); }

  /* Responsive */
  @media (max-width: 520px) {
    .logo-area, .form-header, form { padding-left: 24px; padding-right: 24px; }
    .form-divider { margin-left: 24px; margin-right: 24px; }
    .payment-options { grid-template-columns: 1fr; }
    .toast { min-width: 260px; }
    .toast-container { right: 16px; top: 16px; }
  }
</style>
</head>

  function showToast(type, title, msg) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <div class="toast-icon">${type === 'success' ? '✓' : '⚠'}</div>
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-msg">${msg}</div>
      </div>
      <button class="toast-close" onclick="dismissToast(this.parentElement)">×</button>
    `;
    container.appendChild(toast);
    setTimeout(() => dismissToast(toast), 5000);
  }

  function dismissToast(toast) {
    if (!toast || toast.classList.contains('hide')) return;
    toast.classList.add('hide');
    setTimeout(() => toast.remove(), 320);
  }

  document.getElementById('salesForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const fecha      = document.getElementById('fecha');
    const descripcion = document.getElementById('descripcion');
    const total      = document.getElementById('total');
    const metodo     = document.querySelector('input[name="metodo"]:checked');
    const payOpts    = document.getElementById('paymentOptions');

    // Clear previous errors
    [fecha, descripcion, total].forEach(el => el.classList.remove('error-field'));
    payOpts.classList.remove('error-field-radio');

    const errors = [];

    if (!fecha.value) {
      errors.push('Fecha de la Venta');
      fecha.classList.add('error-field');
    }
    if (!descripcion.value.trim()) {
      errors.push('Descripción de la Venta');
      descripcion.classList.add('error-field');
    }
    if (!total.value || parseFloat(total.value) <= 0) {
      errors.push('Total Pagado');
      total.classList.add('error-field');
    }
    if (!metodo) {
      errors.push('Método de Pago');
      payOpts.classList.add('error-field-radio');
    }

    if (errors.length > 0) {
      showToast('error', 'Campos Incompletos',
        'Por favor complete: <strong>' + errors.join(', ') + '</strong>');
      return;
    }

    // Success
    const fechaFmt = fecha.value.split('-').reverse().join('/');
    showToast('success', '¡Venta Registrada!',
      `Fecha: ${fechaFmt} &bull; Total: $${parseFloat(total.value).toFixed(2)} &bull; ${metodo.value}`);

    this.reset();
    [fecha, descripcion, total].forEach(el => el.classList.remove('error-field'));
    payOpts.classList.remove('error-field-radio');
  });

  // Remove error styling on input
  ['fecha','descripcion','total'].forEach(id => {
    document.getElementById(id).addEventListener('input', function() {
      this.classList.remove('error-field');
    });
  });
  document.querySelectorAll('input[name="metodo"]').forEach(r => {
    r.addEventListener('change', () => {
      document.getElementById('paymentOptions').classList.remove('error-field-radio');
    });
  });
</script>
